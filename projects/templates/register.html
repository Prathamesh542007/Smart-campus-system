{% extends "base.html" %}

{% block title %}Register - Smart Campus Complaint System{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <div class="auth-brand-icon">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <div class="auth-brand-text">
      <h3 class="fw-bold">Student Register</h3>
      <span>Smart Campus Portal</span>
    </div>
  </div>

  <h4 class="fw-bold mb-1">Create Account</h4>
  <p class="text-muted small mb-4">Register with your student details to report campus issues</p>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
        <input 
          type="text" 
          class="form-control border-start-0" 
          id="name" 
          name="name" 
          value="{{ name if name else '' }}" 
          placeholder="e.g. Alex Johnson" 
          required
        >
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Campus / Personal Email</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
        <input 
          type="email" 
          class="form-control border-start-0" 
          id="email" 
          name="email" 
          value="{{ email if email else '' }}" 
          placeholder="alex@student.campus.edu" 
          required
        >
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
        <input 
          type="password" 
          class="form-control border-start-0" 
          id="password" 
          name="password" 
          placeholder="At least 6 characters" 
          required
        >
      </div>
    </div>

    <div class="mb-4">
      <label for="confirm_password" class="form-label">Confirm Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
        <input 
          type="password" 
          class="form-control border-start-0" 
          id="confirm_password" 
          name="confirm_password" 
          placeholder="Re-enter your password" 
          required
        >
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-bold">
      <i class="bi bi-check-circle me-1"></i> Register Account
    </button>
  </form>

  <div class="text-center pt-2">
    <p class="text-muted small mb-0">
      Already have an account? 
      <a href="{{ url_for('login') }}" class="fw-bold text-primary">Sign In</a>
    </p>
  </div>
</div>
{% endblock %}
